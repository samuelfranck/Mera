<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mera - Baseline 3</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: #f5f5f5;
}

.app {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

button {
    font-size: 22px;
    padding: 15px 30px;
    margin: 15px;
    border-radius: 10px;
}

#status {
    font-size: 22px;
    margin: 20px;
}

#transcricao {
    font-size: 22px;
    padding: 20px;
    margin-top: 20px;
    background: #eeeeee;
    min-height: 50px;
    border-radius: 10px;
}

#estado {
    margin-top: 20px;
    font-size: 16px;
    color: #555;
}

</style>

</head>


<body>

<div class="app">

<h1>📺 Mera</h1>

<h2>Baseline 3</h2>

<p id="status">
    Pressione iniciar.
</p>

<button id="iniciar">
    ▶️ Iniciar Mera
</button>
<button onclick="window.open(
'https://app-windows.pluto.tv/live-tv/62e010e6cd663f0007e57dc8/details',
'_blank'
)">
    📺 Testar TV Cultura
</button>

<h3>Última frase reconhecida</h3>

<div id="transcricao">
    ...
</div>

<div id="estado">
    Sistema parado
</div>

</div>


<script>

// ======================================================
// CANAIS
// ======================================================

const CANAIS = {

    cultura: {

        nomes: [
            "cultura",
            "tv cultura"
        ],

        url:
        "https://app-windows.pluto.tv/live-tv/62e010e6cd663f0007e57dc8/details"

    },


    mtv: {

        nomes: [
            "mtv",
            "emetivi"
        ],

        url:
        "https://app-windows.pluto.tv/br/live-tv/5f1212fb81e85c00077ae9ef/details"

    }

};


// ======================================================
// SPEECH RECOGNITION
// ======================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const status =
    document.getElementById("status");

const transcricao =
    document.getElementById("transcricao");

const indicadorEstado =
    document.getElementById("estado");

const botao =
    document.getElementById("iniciar");


let recognition;

let aplicativoAtivo = false;

let falando = false;

let estado =
    "AGUARDANDO_ATIVACAO";

let janelaPluto = null;


// ======================================================
// NORMALIZAÇÃO
// ======================================================

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?]/g, "")
        .trim();

}


// ======================================================
// TTS
// ======================================================

function falar(texto, callback = null) {

    falando = true;

    status.innerText =
        "🔊 Mera falando...";


    try {

        recognition.stop();

    }

    catch (erro) {

        console.log(erro);

    }


    const fala =
        new SpeechSynthesisUtterance(texto);


    fala.lang =
        "pt-BR";

    fala.rate =
        1.0;


    fala.onend = () => {

        falando = false;


        if (callback) {

            callback();

        }


        setTimeout(() => {

            iniciarReconhecimento();

        }, 500);

    };


    speechSynthesis.cancel();

    speechSynthesis.speak(fala);

}


// ======================================================
// ABRIR CANAL
// ======================================================

function abrirCanal(canal) {

    const dados =
        CANAIS[canal];


    indicadorEstado.innerText =
        "Canal atual: " + canal;


    falar(
        "Ok. Abrindo " + canal + ".",

        () => {

            if (
                janelaPluto &&
                !janelaPluto.closed
            ) {

                janelaPluto.location.href =
                    dados.url;

            }

            else {

                // Tentativa alternativa caso
                // a janela tenha sido fechada.

                janelaPluto =
                    window.open(
                        dados.url,
                        "MERA_PLUTO"
                    );

            }


            estado =
                "ASSISTINDO";


            status.innerText =
                '📺 Assistindo. Diga "sair" para voltar.';

        }

    );

}


// ======================================================
// SAIR
// ======================================================

function sair() {

    if (
        janelaPluto &&
        !janelaPluto.closed
    ) {

        janelaPluto.close();

    }


    janelaPluto = null;


    estado =
        "AGUARDANDO_ATIVACAO";


    indicadorEstado.innerText =
        "Nenhum canal aberto";


    falar(

        "Ok. Voltando.",

        () => {

            status.innerText =
                '🎤 Aguardando "Ok Mera"...';

        }

    );

}


// ======================================================
// IDENTIFICAR CANAL
// ======================================================

function identificarCanal(texto) {

    for (
        const nomeCanal
        in CANAIS
    ) {

        const nomes =
            CANAIS[nomeCanal].nomes;


        for (
            const nome
            of nomes
        ) {

            if (
                texto.includes(nome)
            ) {

                return nomeCanal;

            }

        }

    }


    return null;

}


// ======================================================
// PROCESSAMENTO
// ======================================================

function processar(textoOriginal) {

    const texto =
        normalizar(textoOriginal);


    transcricao.innerText =
        textoOriginal;


    console.log(
        "Reconhecido:",
        texto
    );


    // ==================================================
    // COMANDO GLOBAL: SAIR
    // ==================================================

    if (
        texto === "sair" ||
        texto.includes("sair")
    ) {

        sair();

        return;

    }


    // ==================================================
    // AGUARDANDO ATIVAÇÃO
    // ==================================================

    if (
        estado ===
        "AGUARDANDO_ATIVACAO"
    ) {

        if (
            texto.includes("ok mera") ||
            texto.includes("okay mera")
        ) {

            estado =
                "AGUARDANDO_CANAL";


            indicadorEstado.innerText =
                "Mera ativada";


            falar(

                "Ok, qual canal você quer assistir?",

                () => {

                    status.innerText =
                        "🎤 Aguardando canal...";

                }

            );

        }

        return;

    }


    // ==================================================
    // AGUARDANDO CANAL
    // ==================================================

    if (
        estado ===
        "AGUARDANDO_CANAL"
    ) {

        const canal =
            identificarCanal(texto);


        if (canal) {

            abrirCanal(canal);

        }

        else {

            falar(

                "Não encontrei esse canal. Diga Cultura ou MTV.",

                () => {

                    status.innerText =
                        "🎤 Aguardando canal...";

                }

            );

        }


        return;

    }


    // ==================================================
    // ASSISTINDO
    // ==================================================

    if (
        estado === "ASSISTINDO"
    ) {

        // Por enquanto só "sair"
        // possui função nesse estado.

        return;

    }

}


// ======================================================
// CRIAR RECONHECIMENTO
// ======================================================

function criarReconhecimento() {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "pt-BR";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onresult =
        (event) => {

            const resultado =
                event.results[
                    event.results.length - 1
                ];


            if (!resultado.isFinal) {

                return;

            }


            const texto =
                resultado[0].transcript;


            if (!falando) {

                processar(texto);

            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "Erro ASR:",
                event.error
            );

        };


    recognition.onend =
        () => {

            console.log(
                "ASR encerrado"
            );


            if (
                aplicativoAtivo &&
                !falando
            ) {

                setTimeout(() => {

                    iniciarReconhecimento();

                }, 500);

            }

        };

}


// ======================================================
// INICIAR RECONHECIMENTO
// ======================================================

function iniciarReconhecimento() {

    if (
        !aplicativoAtivo ||
        falando
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (erro) {

        console.log(
            "ASR já iniciado."
        );

    }

}


// ======================================================
// INICIAR MERA
// ======================================================

botao.onclick = () => {

    if (!SpeechRecognition) {

        status.innerText =
            "❌ SpeechRecognition não disponível.";

        return;

    }


    criarReconhecimento();


    /*
    A janela da Pluto é criada AGORA,
    durante o toque do usuário.

    Isso é importante porque navegadores
    normalmente bloqueiam window.open()
    iniciado apenas por voz/JavaScript.
    */

    janelaPluto =
        window.open(
            "about:blank",
            "MERA_PLUTO"
        );


    if (janelaPluto) {

        janelaPluto.document.write(`

            <html>

            <body style="
                font-family:Arial;
                text-align:center;
                padding-top:100px;
            ">

            <h1>Mera</h1>

            <p>
                Aguardando escolha do canal...
            </p>

            </body>

            </html>

        `);

    }


    aplicativoAtivo =
        true;


    estado =
        "AGUARDANDO_ATIVACAO";


    botao.style.display =
        "none";


    status.innerText =
        '🎤 Aguardando "Ok Mera"...';


    indicadorEstado.innerText =
        "Mera ativa";


    iniciarReconhecimento();

};

</script>

</body>

</html>
