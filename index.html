<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mera - Teste ASR</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .app {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            font-size: 22px;
            padding: 15px 30px;
            border-radius: 10px;
        }

        #transcricao {
            margin-top: 20px;
            padding: 20px;
            background: #eeeeee;
            border-radius: 10px;
            min-height: 50px;
            font-size: 22px;
        }

    </style>

</head>


<body>

<div class="app">

    <h1>🎤 Mera</h1>

    <p id="status">
        Pressione o botão para falar.
    </p>

    <button id="falar">
        🎤 Falar
    </button>

    <h3>Transcrição</h3>

    <div id="transcricao">
        ...
    </div>

</div>


<script>

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const status =
    document.getElementById("status");

const transcricao =
    document.getElementById("transcricao");

const botao =
    document.getElementById("falar");


if (!SpeechRecognition) {

    status.innerText =
        "❌ SpeechRecognition não disponível.";

    botao.disabled = true;

}

else {

    const recognition =
        new SpeechRecognition();


    recognition.lang = "pt-BR";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        status.innerText =
            "🎤 Ouvindo...";

        transcricao.innerText = "";

    };


    recognition.onresult = (event) => {

        const texto =
            event.results[0][0].transcript;

        transcricao.innerText =
            texto;

        status.innerText =
            "✅ Reconhecimento concluído.";

    };


    recognition.onerror = (event) => {

        status.innerText =
            "❌ Erro: " + event.error;

    };


    recognition.onend = () => {

        botao.disabled = false;

    };


    botao.onclick = () => {

        botao.disabled = true;

        recognition.start();

    };

}

</script>

</body>

</html>
