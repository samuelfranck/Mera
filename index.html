<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mera - Teste de Microfone</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .app {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 10px;
        }

        #status {
            font-size: 20px;
            margin: 20px;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>


<body>

<div class="app">

    <h1>🎤 Mera</h1>

    <h2>Teste do microfone</h2>

    <div id="status">
        Pressione "Iniciar gravação".
    </div>

    <button id="iniciar">
        🎤 Iniciar gravação
    </button>

    <button id="parar" disabled>
        ⏹ Parar
    </button>

    <br>

    <audio id="player"
           controls>
    </audio>

</div>


<script>

let stream;
let recorder;
let partes = [];


const status =
    document.getElementById("status");

const iniciar =
    document.getElementById("iniciar");

const parar =
    document.getElementById("parar");

const player =
    document.getElementById("player");


// ======================================================
// INICIAR GRAVAÇÃO
// ======================================================

iniciar.onclick = async () => {

    try {

        status.innerText =
            "Solicitando acesso ao microfone...";


        // Solicita diretamente o microfone
        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        status.innerText =
            "🎤 Gravando... fale alguma coisa.";


        partes = [];


        recorder =
            new MediaRecorder(stream);


        recorder.ondataavailable = (event) => {

            if (event.data.size > 0) {
                partes.push(event.data);
            }

        };


        recorder.onstop = () => {

            const audioBlob =
                new Blob(
                    partes,
                    {
                        type: recorder.mimeType
                    }
                );


            const audioURL =
                URL.createObjectURL(audioBlob);


            player.src =
                audioURL;


            status.innerText =
                "✅ Gravação concluída. Reproduza o áudio abaixo.";

        };


        recorder.start();


        iniciar.disabled = true;

        parar.disabled = false;

    }

    catch (erro) {

        console.error(erro);

        status.innerText =
            "❌ Erro: " +
            erro.name +
            " - " +
            erro.message;

    }

};


// ======================================================
// PARAR GRAVAÇÃO
// ======================================================

parar.onclick = () => {

    if (
        recorder &&
        recorder.state !== "inactive"
    ) {

        recorder.stop();

    }


    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

    }


    iniciar.disabled = false;

    parar.disabled = true;

};

</script>

</body>

</html>
