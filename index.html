<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mera - Baseline 3.1</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: #f5f5f5;
}

.app {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

button {
    font-size: 22px;
    padding: 15px 30px;
    margin: 15px;
    border-radius: 10px;
}

#status {
    font-size: 22px;
    margin: 20px;
}

#transcricao {
    font-size: 22px;
    padding: 20px;
    margin-top: 20px;
    background: #eeeeee;
    min-height: 50px;
    border-radius: 10px;
}

</style>

</head>

<body>

<div class="app">

    <h1>📺 Mera</h1>

    <h2>Baseline 3.1</h2>

    <p id="status">
        Pressione iniciar.
    </p>

    <button id="iniciar">
        ▶️ Iniciar Mera
    </button>

    <h3>Última frase reconhecida</h3>

    <div id="transcricao">
        ...
    </div>

</div>


<script>

// ======================================================
// CANAIS
// ======================================================

const CANAIS = {

    cultura: {

        nomes: [
            "cultura",
            "tv cultura"
        ],

        url:
        "https://app-windows.pluto.tv/live-tv/62e010e6cd663f0007e57dc8/details"

    },


    mtv: {

        nomes: [
            "mtv",
            "emetivi"
        ],

        url:
        "https://app-windows.pluto.tv/br/live-tv/5f1212fb81e85c00077ae9ef/details"

    }

};


// ======================================================
// ELEMENTOS
// ======================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const status =
    document.getElementById("status");

const transcricao =
    document.getElementById("transcricao");

const botao =
    document.getElementById("iniciar");


let recognition;

let aplicativoAtivo = false;

let falando = false;

let estado =
    "AGUARDANDO_ATIVACAO";


// ======================================================
// NORMALIZAR
// ======================================================

function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?]/g, "")
        .trim();

}


// ======================================================
// TTS
// ======================================================

function falar(texto, callback = null) {

    falando = true;


    try {

        recognition.stop();

    }

    catch (erro) {

        console.log(erro);

    }


    const fala =
        new SpeechSynthesisUtterance(texto);


    fala.lang =
        "pt-BR";


    fala.rate =
        1.0;


    fala.onend = () => {

        falando = false;


        if (callback) {

            callback();

        }


        // Só reinicia o ASR se ainda estivermos
        // na página do Mera.

        setTimeout(() => {

            iniciarReconhecimento();

        }, 500);

    };


    speechSynthesis.cancel();

    speechSynthesis.speak(fala);

}


// ======================================================
// IDENTIFICAR CANAL
// ======================================================

function identificarCanal(texto) {

    for (const canal in CANAIS) {

        for (
            const nome
            of CANAIS[canal].nomes
        ) {

            if (
                texto.includes(nome)
            ) {

                return canal;

            }

        }

    }


    return null;

}


// ======================================================
// ABRIR CANAL
// ======================================================

function abrirCanal(canal) {

    const dados =
        CANAIS[canal];


    status.innerText =
        "📺 Abrindo " + canal + "...";


    /*
    TESTE PRINCIPAL DO BASELINE 3.1

    Não usamos window.open().
    Não usamos outra aba.

    A própria página do Mera
    navega para a Pluto.
    */


    falar(

        "Ok. Abrindo " + canal + ".",

        () => {

            aplicativoAtivo =
                false;


            window.location.href =
                dados.url;

        }

    );

}


// ======================================================
// PROCESSAR TEXTO
// ======================================================

function processar(textoOriginal) {

    const texto =
        normalizar(textoOriginal);


    transcricao.innerText =
        textoOriginal;


    console.log(
        "Reconhecido:",
        texto
    );


    // ==================================================
    // AGUARDANDO OK MERA
    // ==================================================

    if (
        estado ===
        "AGUARDANDO_ATIVACAO"
    ) {

        if (
            texto.includes("ok mera") ||
            texto.includes("okay mera")
        ) {

            estado =
                "AGUARDANDO_CANAL";


            status.innerText =
                "🔊 Mera ativada";


            falar(

                "Ok, qual canal você quer assistir?",

                () => {

                    status.innerText =
                        "🎤 Aguardando canal...";

                }

            );

        }


        return;

    }


    // ==================================================
    // AGUARDANDO CANAL
    // ==================================================

    if (
        estado ===
        "AGUARDANDO_CANAL"
    ) {

        const canal =
            identificarCanal(texto);


        if (canal) {

            abrirCanal(canal);

        }

        else {

            falar(

                "Não encontrei esse canal. Diga Cultura ou MTV.",

                () => {

                    status.innerText =
                        "🎤 Aguardando canal...";

                }

            );

        }


        return;

    }

}


// ======================================================
// CRIAR ASR
// ======================================================

function criarReconhecimento() {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "pt-BR";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onresult =
        (event) => {

            const resultado =
                event.results[
                    event.results.length - 1
                ];


            if (!resultado.isFinal) {

                return;

            }


            const texto =
                resultado[0].transcript;


            if (!falando) {

                processar(texto);

            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "Erro ASR:",
                event.error
            );

        };


    recognition.onend =
        () => {

            if (
                aplicativoAtivo &&
                !falando
            ) {

                setTimeout(() => {

                    iniciarReconhecimento();

                }, 500);

            }

        };

}


// ======================================================
// INICIAR ASR
// ======================================================

function iniciarReconhecimento() {

    if (
        !aplicativoAtivo ||
        falando
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (erro) {

        console.log(
            "ASR já iniciado"
        );

    }

}


// ======================================================
// INICIAR MERA
// ======================================================

botao.onclick = () => {

    if (!SpeechRecognition) {

        status.innerText =
            "❌ SpeechRecognition não disponível.";

        return;

    }


    criarReconhecimento();


    aplicativoAtivo =
        true;


    estado =
        "AGUARDANDO_ATIVACAO";


    botao.style.display =
        "none";


    status.innerText =
        '🎤 Aguardando "Ok Mera"...';


    iniciarReconhecimento();

};

</script>

</body>

</html>
